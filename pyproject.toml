[project]
name = "fa"
version = "0.1.0"
description = "fa — 足球量化分析与投注推荐（spec.md）"
requires-python = ">=3.11"
dependencies = ["pandas>=2.0,<3", "scipy>=1.11", "typer>=0.12", "numpy>=1.26"]

[project.scripts]
fa = "fa.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fa"]

[dependency-groups]
dev = ["pytest>=8.0"]
dashboard = ["streamlit>=1.40", "plotly>=5.24"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["dashboard"]
